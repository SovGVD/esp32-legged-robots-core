<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14171c" />
    <title>Robot</title>
    <!-- Robot config (websocket url, features), generated by the firmware -->
    <script src="/c.js" vite-ignore></script>
  </head>
  <body data-state="offline">
    <header id="hud">
      <span id="conn" class="conn" title="Connection"></span>
      <span id="power" class="mono small"></span>
      <nav id="tabs">
        <button type="button" data-tab="view">View</button>
        <button type="button" data-tab="map">Map</button>
        <button type="button" data-tab="status">Status</button>
        <button type="button" data-tab="cli">CLI</button>
        <button type="button" data-tab="settings">Settings</button>
      </nav>
    </header>
    <main id="control">
      <div id="alerts"></div>
      <section class="pane" id="pane-view" data-pane="view">
        <div id="tof"></div>
      </section>
      <section class="pane" id="pane-map" data-pane="map">
        <div id="map"></div>
      </section>
      <section class="pane page" id="pane-status" data-pane="status">
        <div id="cards" class="cards"></div>
      </section>
      <section class="pane page" id="pane-cli" data-pane="cli">
        <form id="cli-form">
          <input id="cli-input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="command, e.g. help" />
          <button type="submit">Send</button>
        </form>
        <pre id="cli-output"></pre>
      </section>
      <section class="pane page" id="pane-settings" data-pane="settings">
        <div class="settings">
          <nav class="seg tabs2" id="set-nav"></nav>
          <div data-sec="move">
            <label class="row" id="walk-label" hidden>
              <input type="checkbox" id="walk" />
              <span><b>Walk</b><span class="dim">Statically stable walk instead of trot. Switches when the robot stands still.</span></span>
            </label>
            <label class="row" id="level-label" hidden>
              <input type="checkbox" id="level" />
              <span><b>Level</b><span class="dim">IMU leveling: keep the body horizontal on a slope.</span></span>
            </label>
            <label class="row">
              <input type="checkbox" id="rotate" />
              <span><b>Tilt mode</b><span class="dim">The right stick tilts the body instead of walking (also the button above the right stick).</span></span>
            </label>
          </div>
          <div data-sec="app">
            <div class="row">
              <span><b>Stick size</b></span>
              <span class="seg" id="stick-size">
                <button type="button" data-size="s">S</button><button type="button" data-size="m">M</button><button type="button" data-size="l">L</button>
              </span>
            </div>
            <p class="dim small" id="about"></p>
          </div>
          <pre id="set-log" class="mono small" title="Robot replies"></pre>
        </div>
      </section>
      <div class="stick" id="stick-left"><span class="hint">turn</span></div>
      <div class="stick" id="stick-right"><span class="hint" id="right-hint">move</span></div>
      <button type="button" id="mode-chip" title="Right stick: walk or tilt the body">tilt</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
