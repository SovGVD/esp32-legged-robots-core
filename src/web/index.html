<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14171c" />
    <title>Robot</title>
    <!-- Robot config (websocket url, features), generated by the firmware -->
    <script src="/c.js" vite-ignore></script>
  </head>
  <body data-state="offline">
    <header>
      <span id="conn" class="conn">Offline</span>
      <span id="power" class="mono"></span>
      <span id="loop" class="mono dim"></span>
      <span id="status" class="small" title="gait · leveling · IMU tilt (sideways, nose) · missed motion ticks · IK out of reach/joint limit/servo range"></span>
      <button id="take-control" type="button" hidden>Take control</button>
      <span class="spacer"></span>
      <span id="version" class="dim mono small"></span>
      <label id="walk-label" title="Statically stable walk instead of trot. Switches when the robot stands still." hidden><input type="checkbox" id="walk" /> Walk</label>
      <label id="level-label" title="IMU leveling: keep the body horizontal on a slope" hidden><input type="checkbox" id="level" /> Level</label>
      <label id="tof-label" title="Distance sensor zones (cm), as each sensor looks: red close, blue far, grey no target" hidden><input type="checkbox" id="tof-toggle" /> ToF</label>
      <label id="map-label" title="Lidar map: tap a point to walk there" hidden><input type="checkbox" id="map-toggle" /> Map</label>
      <label><input type="checkbox" id="rotate" /> Rotate</label>
      <label><input type="checkbox" id="cli-toggle" /> CLI</label>
    </header>
    <main id="control">
      <div id="tof" hidden></div>
      <div id="map" hidden></div>
      <div class="stick" id="stick-left"><span class="hint">turn</span></div>
      <div class="stick" id="stick-right"><span class="hint">move</span></div>
    </main>
    <section id="cli" hidden>
      <pre id="cli-output"></pre>
      <form id="cli-form">
        <input id="cli-input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="command" />
        <button type="submit">Send</button>
      </form>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
