; PlatformIO build configuration for ESP32 legged robots.
;
; Build:   pio run -e robot-dog
; Upload:  pio run -e robot-dog -t upload
; Monitor: pio device monitor
;
; Every robot model is its own environment. The model is selected with
; -DROBOT_MODEL=<MODEL_*> (see src/esp32-legged-robot/def/def.h), which
; replaces the config_model.h file the old build.sh used to generate.

[platformio]
src_dir = src/esp32-legged-robot
default_envs = robot-dog

[esp32]
; pioarduino community platform: Arduino-ESP32 core 3.3.x on ESP-IDF 5.5.
; The official platformio/espressif32 platform is frozen at Arduino core 2.0.17.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; writes .pio/build/<env>/flash_images.json for the browser flasher (GitHub Pages)
extra_scripts = post:tools/webflash/flash_images.py

build_flags =
	-Wall
	-Wno-unused-variable
	-Wno-unused-function
	; VL53L5CX: read only distances and target status (smaller I2C transfers)
	-DVL53L5CX_DISABLE_AMBIENT_PER_SPAD
	-DVL53L5CX_DISABLE_NB_SPADS_ENABLED
	-DVL53L5CX_DISABLE_NB_TARGET_DETECTED
	-DVL53L5CX_DISABLE_SIGNAL_PER_SPAD
	-DVL53L5CX_DISABLE_RANGE_SIGMA_MM
	-DVL53L5CX_DISABLE_REFLECTANCE_PERCENT
	-DVL53L5CX_DISABLE_MOTION_INDICATOR

; The ESP32 FPU only handles single precision; double math is emulated in
; software. Keep floating literals (and M_PI etc.) as float in our sources.
; (lib/robot_core is built with the same flag through its library.json.)
build_src_flags =
	-fsingle-precision-constant

lib_deps =
	esp32async/AsyncTCP @ ^3.5.0
	esp32async/ESPAsyncWebServer @ ^3.12.1
	wollewald/MPU9250_WE @ ^1.2.17
	wollewald/INA219_WE @ ^1.4.1
	adafruit/Adafruit PWM Servo Driver Library @ ^3.0.3
	sparkfun/SparkFun VL53L5CX Arduino Library @ ^1.0.3

[env:robot-dog]
extends = esp32
board = esp32doit-devkit-v1
build_flags =
	${esp32.build_flags}
	-DROBOT_MODEL=MODEL_DOG

; the dog with an LD06 / LD19 lidar instead of the ToF room scans (or
; uncomment LIDAR_TYPE in model/dog/config.h)
[env:robot-dog-lidar]
extends = env:robot-dog
build_flags =
	${env:robot-dog.build_flags}
	-DLIDAR_TYPE=LD06

[env:robot-tank]
extends = esp32
board = esp32doit-devkit-v1
build_flags =
	${esp32.build_flags}
	-DROBOT_MODEL=MODEL_TANK

[env:robot-biped]
extends = esp32
board = esp32cam
build_flags =
	${esp32.build_flags}
	-DROBOT_MODEL=MODEL_BIPED

[env:robot-hexapod]
extends = esp32
board = esp32cam
build_flags =
	${esp32.build_flags}
	-DROBOT_MODEL=MODEL_HEXAPOD

; Hardware independent motion core (lib/robot_core) unit tests on the PC:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
	-Wno-missing-field-initializers
	-Wno-unused-parameter
	; model descriptions (model/<name>/model_data.h) are Arduino free
	-I src/esp32-legged-robot
; the firmware itself needs Arduino, only lib/robot_core is built
build_src_filter = -<*>
