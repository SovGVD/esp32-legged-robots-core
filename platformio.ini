; PlatformIO build configuration for ESP32 legged robots.
;
; Build:   pio run -e robot-dog
; Upload:  pio run -e robot-dog -t upload
; Monitor: pio device monitor
;
; Every robot model is its own environment. The model is selected with
; -DROBOT_MODEL=<MODEL_*> (see src/esp32-legged-robot/def/def.h), which
; replaces the config_model.h file the old build.sh used to generate.

[platformio]
src_dir = src/esp32-legged-robot
default_envs = robot-dog

[env]
; pioarduino community platform: Arduino-ESP32 core 3.3.x on ESP-IDF 5.5.
; The official platformio/espressif32 platform is frozen at Arduino core 2.0.17.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Sources under libraries/ and model/ are #include'd from the sketch, so only
; the .ino files (merged into one translation unit, as Arduino IDE does) are
; compiled directly.
build_src_filter = -<*> +<*.ino.cpp>

build_flags =
	-Wall
	-Wno-unused-variable
	-Wno-unused-function

lib_deps =
	esp32async/AsyncTCP @ ^3.5.0
	esp32async/ESPAsyncWebServer @ ^3.12.1
	wollewald/MPU9250_WE @ ^1.2.17
	wollewald/INA219_WE @ ^1.4.1
	adafruit/Adafruit PWM Servo Driver Library @ ^3.0.3

[env:robot-dog]
board = esp32doit-devkit-v1
build_flags =
	${env.build_flags}
	-DROBOT_MODEL=MODEL_DOG

[env:robot-tank]
board = esp32doit-devkit-v1
build_flags =
	${env.build_flags}
	-DROBOT_MODEL=MODEL_TANK

[env:robot-biped]
board = esp32cam
build_flags =
	${env.build_flags}
	-DROBOT_MODEL=MODEL_BIPED

[env:robot-hexapod]
board = esp32cam
build_flags =
	${env.build_flags}
	-DROBOT_MODEL=MODEL_HEXAPOD
