name: Build firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [robot-dog, robot-dog-lidar, robot-tank, robot-biped, robot-hexapod, robot-hexapod2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -U platformio
      - run: pio run -e ${{ matrix.env }}
      # the browser flasher (pages.yml, main only) needs these; check them on
      # every build, nothing is published from here
      - run: python3 tools/webflash/build_site.py --out /tmp/site --version check .pio/build/${{ matrix.env }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -U platformio
      - run: pio test -e native

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r sim/requirements.txt
      # builds lib/robot_core + sim/bridge with the runner's g++ and runs the
      # firmware motion code against the MuJoCo model
      - run: python -m pytest -q sim/tests
